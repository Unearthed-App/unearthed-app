version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
        - env | grep -E "^(CLERK_SECRET_KEY|WEBHOOK_SECRET|DRIZZLE_ENV|DEV_DATABASE_URL|PROD_DATABASE_URL|DOMAIN|CRON_TOKEN|NOTION_CLIENT_ID|NOTION_SECRET|CAPACITIES_CLIENT_ID|CAPACITIES_REDIRECT_URI|RESEND_API_KEY|MAILGUN_API_KEY|MAILGUN_RECIPIENT|MAILGUN_DOMAIN|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|STRIPE_PRICE_ID|STRIPE_LOCAL_PRICE_ID|STRIPE_LOCAL_PRODUCT_ID|STRIPE_LOCAL_PRODUCT_NAME|STRIPE_MOBILE_PRICE_ID|STRIPE_MOBILE_PRODUCT_ID|STRIPE_MOBILE_PRODUCT_NAME|UPLOADTHING_TOKEN|AI_GOOGLE_KEY|AI_GOOGLE_MODEL|AI_INPUT_COST_PER_M|AI_OUTPUT_COST_PER_M|AI_DOLLAR_LIMIT|NEXT_PUBLIC_[A-Z0-9_]+)=" > .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
